<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- اسم علامة التبويب بالتشكيل الكامل -->
    <title>رَفِيقَةُ رُوحِي ♥</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff0f5 0%, #fbc2eb 100%);
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* القلوب المتساقطة في الخلفية */
        .heart-bg {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            opacity: 0.3;
            animation: fall linear infinite;
            z-index: 1;
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            width: 95%;
            max-width: 480px;
        }

        .title {
            color: #c2185b;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* حاوية الخدش السحرية */
        .scratch-container {
            position: relative;
            width: 100%;
            height: 260px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        /* الرسائل الحقيقية المخبأة بالأسفل بالتشكيل */
        .secret-message {
            font-size: 1.4rem;
            color: #4a001f;
            line-height: 1.8;
            font-weight: bold;
            padding: 25px;
            text-align: center;
            user-select: none;
        }

        /* لوحة القماش (Canvas) التي سيتم خدشها ومسحها */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            z-index: 2;
            touch-action: none;
        }

        .hint {
            font-size: 1.1rem;
            color: #d81b60;
            font-weight: bold;
            margin-top: 10px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="hearts-container"></div>

    <div class="container">
        <!-- تم مسح الاسم من هنا وأصبحت عامة لـ نورهان بداخل الرسالة المخبأة فقط -->
        <div class="title">✨ لَوْحَةُ الخَدْشِ السِّحْرِيَّةِ ♥</div>
        
        <div class="scratch-container" id="card-area">
            <div class="secret-message">
                "إِنَّ أَثمَنَ هَدِيَّةٍ قَد تَنَالُهَا : «صَدِيق» عَلَى هَيئَةِ حَيَاةٍ .. وَأَنْتِ أَثْمَنُ هَدَايَا الأَيَّامِ يَا نُورْهَانْ"
            </div>
            <canvas id="scratch-canvas"></canvas>
        </div>

        <div class="hint">✨ استخدمي إصبعِك لمسح الغطاء الوردي واكتشاف المفاجأة! ✨</div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('card-area');

        function initCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            ctx.fillStyle = '#ffb6c1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px Cairo, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♥ اِمْسَحِي هُنَا ♥', canvas.width / 2, canvas.height / 2);
        }

        let isDrawing = false;

        function scratch(e) {
            if (!isDrawing) return;

            const rect = canvas.getBoundingClientRect();
            let x, y;

            if (e.touches && e.touches[0]) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);

        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

        window.addEventListener('load', initCanvas);
        window.addEventListener('resize', initCanvas);

        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 25; i++) {
                let heart = document.createElement('div');
                heart.className = 'heart-bg';
                heart.innerText = '♥';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = Math.random() * -20 + 'vh';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();
    </script>
</body>
</html>
